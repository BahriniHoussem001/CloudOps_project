services:
  postgres:
    image: postgres:16
    container_name: cloudops-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloudops_db
    ports:
      - "5432:5432"
    volumes:
      - cloudops_postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/CloudOps.Api/Dockerfile
    container_name: cloudops-api
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=cloudops_db;Username=postgres;Password=postgres

volumes:
  cloudops_postgres_data: