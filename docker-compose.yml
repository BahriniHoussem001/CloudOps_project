services:
  postgres:
    image: postgres:16
    container_name: cloudops-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloudops_db
    ports:
      - "5432:5432"
    volumes:
      - cloudops_postgres_data:/var/lib/postgresql/data

volumes:
  cloudops_postgres_data: