services:
  jenkins:
    build:
      context: ./devops/jenkins
      dockerfile: Dockerfile
    container_name: cloudops-jenkins
    restart: always
    user: root
    ports:
      - "9090:8080"
      - "50000:50000"
    volumes:
      - cloudops_jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  cloudops_jenkins_home: